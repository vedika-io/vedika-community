name: SDK or API problem
description: Report reproducible developer-facing behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, authorization headers, birth details, customer data, account identifiers, or private API responses. Use private support for account-specific cases and private vulnerability reporting for security issues.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - REST API
        - JavaScript or TypeScript SDK
        - Python SDK
        - React SDK
        - Android SDK
        - Swift SDK
        - MCP server
        - Sandbox
        - Documentation example
        - Other public integration
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK and runtime versions
      description: For example, @vedika-io/sdk 3.0.10 on Node.js 24.
    validations:
      required: true
  - type: input
    id: operation
    attributes:
      label: Documented operation or page
      description: Provide a public documentation URL or operation identifier.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal safe reproduction
      description: Use synthetic inputs and redact all credentials and personal data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a sanitized error and status code. A redacted request ID is acceptable.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, personal data, customer content, and private account information.
          required: true
        - label: This is not a security vulnerability or abuse report.
          required: true
