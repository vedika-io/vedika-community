name: Documentation correction
description: Report unclear, missing, or incorrect public documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: url
    attributes:
      label: Documentation URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Include a verified example or primary source when relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-content confirmation
      options:
        - label: This report contains no secrets, personal data, customer content, or private account information.
          required: true
